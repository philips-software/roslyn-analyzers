name: Sync AI Agent Instructions

on:
  push:
    paths:
      - 'CLAUDE.md'
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Generate copilot-instructions.md
        run: |
          {
            echo "# Philips Roslyn Analyzers — AI Coding Instructions"
            echo ""
            echo "> AUTO-GENERATED from CLAUDE.md. Do not edit directly — update CLAUDE.md instead."
            tail -n +2 CLAUDE.md
          } > .github/copilot-instructions.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/copilot-instructions.md
          git diff --staged --quiet || git commit -m "chore: Auto-sync Copilot instructions from CLAUDE.md"
          git push
