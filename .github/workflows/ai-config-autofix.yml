name: AI Config Autofix

on:
  push:
    branches-ignore: [main]
    paths:
      - 'CLAUDE.md'
      - '.claude/skills/*/SKILL.md'

# The default GITHUB_TOKEN is intentionally read-only. Pushes made with it do
# not start the normal pull-request CI suite, so generated commits use the
# repository's least-privilege GitHub App installation instead.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Regenerate AI Config
    runs-on: ubuntu-latest
    steps:
      - name: Create AI config GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AI_CONFIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_CONFIG_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Test AI config generator
        run: python3 .github/scripts/test_ai_config.py

      - name: Regenerate derived files
        run: python3 .github/scripts/ai_config.py --write

      - name: Resolve GitHub App bot identity
        id: app-user
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          APP_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "user-id=${APP_USER_ID}" >> "$GITHUB_OUTPUT"

      - name: Commit if changed
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.user-id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add --all -- .github/copilot-instructions.md .agents/skills
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Regenerate AI config from CLAUDE.md"
            git push
          fi
