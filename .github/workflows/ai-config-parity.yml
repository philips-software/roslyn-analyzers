name: AI Config Parity

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity-check:
    name: AI Config Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Test AI config parity validator
        run: python3 .github/scripts/test_ai_config.py

      - name: Check generated instructions and agent adapters
        run: python3 .github/scripts/ai_config.py --check
