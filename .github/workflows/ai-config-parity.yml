name: AI Config Parity

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity-check:
    name: AI Config Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install MCP server dependency
        run: python3 -m pip install --require-hashes --requirement tools/mcp/requirements.lock

      - name: Smoke-test MCP stdio server
        run: python3 tools/mcp/test_stdio_server.py

      - name: Test AI config parity validator
        run: python3 .github/scripts/test_ai_config.py

      - name: Check generated instructions and agent adapters
        run: python3 .github/scripts/ai_config.py --check
