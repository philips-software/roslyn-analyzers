name: SonarCloud
on:
  workflow_call:
    secrets:    
      sonar-auth-token:
        required: true
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # ratchet:actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # @v6.0.0
        with:
          dotnet-version: |
            3.1.x
            8.0.x
      - name: Install Tools
        run: |
          dotnet tool update dotnet-sonarscanner --global
          dotnet tool update dotnet-coverage --global
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.sonar-auth-token }}
        run: |
          # CI-only Python helpers have their own enforced regression suite in ai-config-parity.yml.
          dotnet sonarscanner begin /k:"philips-software_roslyn-analyzers" /o:"philips-software" /d:sonar.token="$SONAR_TOKEN" /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" /d:sonar.coverage.exclusions=".github/scripts/**" /d:sonar.host.url="https://sonarcloud.io"
          dotnet build --configuration Debug
          dotnet coverage collect 'dotnet test' -f xml -o 'coverage.xml'
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
